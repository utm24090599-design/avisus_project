<nav class="navbar" [class.navbar-hidden]="!isNavbarVisible()">
  <div class="navbar-container">
    <a class="navbar-brand" href="/">
      <h1 class="nav-title">Avisus</h1>
    </a>
    <ul class="navbar-menu">
      <li class="navbar-item navbar-hamburger">
        <button (click)="onMenuClick()" aria-label="Abrir menú">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </li>
      @if(!currentUser() && !currentRouter().endsWith('/login')) {
        <li class="navbar-item"><app-primary-button class="navbar-login-btn" (onClick)="onLogingClick()">Log in</app-primary-button></li>
      }
      @if(currentUser() && !currentRouter().endsWith('/login')) {
        <li class="navbar-item"><app-primary-button class="navbar-login-btn" (onClick)="logout()">Log out</app-primary-button></li>
      }
    </ul>
  </div>
</nav>
