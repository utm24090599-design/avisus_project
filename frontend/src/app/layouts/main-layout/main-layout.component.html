
<div class="main-layout__container">
	<!-- Navbar -->
	<header class="main-layout__navbar">
		<app-navbar-layout (menuToggle)="toggleSidebar()"></app-navbar-layout>
	</header>

	<!-- Sidebar y contenido -->
	<div class="main-layout__body">
		<aside class="main-layout__sidebar" [class.open]="isSidebarOpen">
			<app-sidebar-layout *ngIf="isSidebarOpen" (close)="closeSidebar()"></app-sidebar-layout>
		</aside>
		<main class="main-layout__content">
			<router-outlet></router-outlet>
		</main>
	</div>

	<!-- Footer -->
	<footer class="main-layout__footer">
		<div class="footer-content">
			<span>© 2025 Avisus. Todos los derechos reservados.</span>
		</div>
	</footer>
</div>
